server:
  port: 8080

spring:
  application:
    name: adhiemb-backend
  profiles:
    active: dev

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
    issuer: adhiemb
  storage:
    type: ${STORAGE_TYPE:local}
    fstore-path: ${FSTORE_PATH:./fstore}
    upload-dir: ${UPLOAD_DIR:./fstore}
    max-file-size: 5MB
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3:
      bucket: ${AWS_S3_BUCKET:adhiemb-ecom-fstore}
