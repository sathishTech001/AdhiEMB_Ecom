name: AdhiEMB CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: adhiemb_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: adhiemb-backend

    env:
      JWT_SECRET: "CiDummyJwtSecretKeyForTestingPurposesMustBeAtLeast256BitsLongForHS256Algorithm"
      DB_URL: "jdbc:mysql://127.0.0.1:3306/adhiemb_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: "root"
      DB_PASSWORD: "testpassword"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend (Maven)
        run: mvn clean package

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: adhiemb-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'adhiemb-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

  backend-docker:
    name: Build & Push Backend Docker Image
    needs: backend-ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./adhiemb-backend
          file: ./adhiemb-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:latest

  frontend-docker:
    name: Build & Push Frontend Docker Image
    needs: frontend-ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./adhiemb-frontend
          file: ./adhiemb-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:latest

  release-ready:
    name: Prepare Release Reference
    needs: [backend-docker, frontend-docker]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Report Release Readiness
        run: |
          echo "=================================================="
          echo "RELEASE ARTIFACTS VERIFIED AND READY FOR DEPLOYMENT"
          echo "=================================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Release Tag: ${{ steps.vars.outputs.sha_short }}"
          echo "Backend Image: ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:${{ steps.vars.outputs.sha_short }}"
          echo "Frontend Image: ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:${{ steps.vars.outputs.sha_short }}"
          echo "=================================================="

  deploy-ec2:
    name: Deploy to Production EC2 (AWS SSM + OIDC)
    needs: [backend-docker, frontend-docker]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "Release SHA: ${SHA_SHORT}"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Write SSM Deployment Script
        run: |
          RELEASE_TAG="${{ steps.vars.outputs.sha_short }}"
          echo "=================================================="
          echo "STARTING ADHIEMB CONTROLLED PRODUCTION DEPLOYMENT (SSM)"
          echo "Target Instance ID: ${{ vars.EC2_INSTANCE_ID }}"
          echo "Release Tag: ${RELEASE_TAG}"
          echo "=================================================="

          python3 - << 'PYEOF'
          import json, subprocess, sys, os

          release_tag = os.environ.get("RELEASE_TAG", "")

          if not release_tag:
              print("ERROR: RELEASE_TAG is empty. Aborting.")
              raise SystemExit(1)

          print(f"Building deploy script for release_tag={release_tag!r}")

          deploy_commands = [
              "set -e",
              f"echo 'RELEASE_TAG={release_tag}'",
              "cd /home/ubuntu/adhiemb-ecom",
              "git pull origin main || true",
              "docker --version",
              "docker compose version",
              "if [ ! -f 'docker/docker-compose.prod.yml' ] || [ ! -f 'docker/.env.prod' ]; then echo 'ERROR: Required compose or env files missing!'; exit 1; fi",
              "PREV_BACKEND=$(docker inspect --format='{{.Config.Image}}' adhiemb-backend-prod 2>/dev/null || echo 'none')",
              "PREV_FRONTEND=$(docker inspect --format='{{.Config.Image}}' adhiemb-frontend-prod 2>/dev/null || echo 'none')",
              'echo "Baseline: Backend=${PREV_BACKEND} Frontend=${PREV_FRONTEND}"',
              f"echo 'Pulling sathishg26/adhiemb-backend:{release_tag}'",
              f"docker pull sathishg26/adhiemb-backend:{release_tag}",
              f"echo 'Pulling sathishg26/adhiemb-frontend:{release_tag}'",
              f"docker pull sathishg26/adhiemb-frontend:{release_tag}",
              f"BACKEND_IMAGE_TAG={release_tag} FRONTEND_IMAGE_TAG={release_tag} docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml config > /dev/null",
              f"echo 'Deploying backend with --force-recreate...'",
              f"BACKEND_IMAGE_TAG={release_tag} FRONTEND_IMAGE_TAG={release_tag} docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d --force-recreate --no-build backend",
              "sleep 8",
              f"RUNNING_BACKEND=$(docker inspect --format='{{{{.Config.Image}}}}' adhiemb-backend-prod 2>/dev/null || echo NOT_RUNNING)",
              f"echo Running backend image: $RUNNING_BACKEND",
              f"if [ \"$RUNNING_BACKEND\" != \"sathishg26/adhiemb-backend:{release_tag}\" ]; then echo ERROR: Backend image mismatch. Expected sathishg26/adhiemb-backend:{release_tag} got $RUNNING_BACKEND; docker logs --tail 50 adhiemb-backend-prod 2>/dev/null || true; exit 1; fi",
              f"echo VERIFIED: Backend running sathishg26/adhiemb-backend:{release_tag}",
              "HEALTH_PASSED=false",
              "for i in $(seq 1 15); do if docker exec adhiemb-backend-prod wget -q -O - http://localhost:8080/actuator/health 2>/dev/null | grep -q UP; then echo Backend health check PASSED; HEALTH_PASSED=true; break; fi; echo Health attempt $i/15; sleep 5; done",
              'if [ "$HEALTH_PASSED" = "false" ]; then echo "ERROR: Backend health check failed!"; docker logs --tail 100 adhiemb-backend-prod; exit 1; fi',
              f"echo 'Deploying frontend with --force-recreate...'",
              f"BACKEND_IMAGE_TAG={release_tag} FRONTEND_IMAGE_TAG={release_tag} docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d --force-recreate --no-build frontend",
              "sleep 5",
              f"RUNNING_FRONTEND=$(docker inspect --format='{{{{.Config.Image}}}}' adhiemb-frontend-prod 2>/dev/null || echo NOT_RUNNING)",
              f"echo Running frontend image: $RUNNING_FRONTEND",
              f"if [ \"$RUNNING_FRONTEND\" != \"sathishg26/adhiemb-frontend:{release_tag}\" ]; then echo ERROR: Frontend image mismatch. Expected sathishg26/adhiemb-frontend:{release_tag} got $RUNNING_FRONTEND; docker logs --tail 50 adhiemb-frontend-prod 2>/dev/null || true; exit 1; fi",
              f"echo VERIFIED: Frontend running sathishg26/adhiemb-frontend:{release_tag}",
              "echo ==================================================",
              "echo FINAL RUNNING CONTAINERS:",
              "docker ps --format 'table {{.Names}}\\t{{.Image}}\\t{{.Status}}'",
              "echo ==================================================",
              f"echo IMAGE TAG VERIFICATION PASSED",
              f"echo Backend  : sathishg26/adhiemb-backend:{release_tag}",
              f"echo Frontend : sathishg26/adhiemb-frontend:{release_tag}",
              "echo ==================================================",
              "curl -f -s https://adhiemb.com/api/public/products > /dev/null && echo API endpoint: OK || echo WARNING: API check failed",
              "curl -f -s https://adhiemb.com/actuator/health > /dev/null && echo Health endpoint: OK || echo WARNING: Health check failed",
              f"echo SUCCESS: Deployment completed cleanly for SHA {release_tag}",
          ]


          full_script = "\n".join(deploy_commands)
          params = {"commands": [full_script]}
          with open("/tmp/ssm_parameters.json", "w") as f:
              json.dump(params, f)
          print("SSM parameters JSON written to /tmp/ssm_parameters.json")
          PYEOF
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.sha_short }}

      - name: Execute Deployment on EC2 via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_parameters.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command Sent. Command ID: $COMMAND_ID"
          echo "Waiting for SSM execution..."

          aws ssm wait command-executed \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "SSM Execution Status: $STATUS"

          echo "SSM Command Output:"
          aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: SSM Command execution failed with status: $STATUS"
            echo "SSM Standard Error:"
            aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi