name: AdhiEMB CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release SHA/tag to deploy'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: adhiemb_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: adhiemb-backend

    env:
      JWT_SECRET: "CiDummyJwtSecretKeyForTestingPurposesMustBeAtLeast256BitsLongForHS256Algorithm"
      DB_URL: "jdbc:mysql://127.0.0.1:3306/adhiemb_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: "root"
      DB_PASSWORD: "testpassword"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend (Maven)
        run: mvn clean package

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: adhiemb-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'adhiemb-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

  backend-docker:
    name: Build & Push Backend Docker Image
    needs: backend-ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./adhiemb-backend
          file: ./adhiemb-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:latest

  frontend-docker:
    name: Build & Push Frontend Docker Image
    needs: frontend-ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./adhiemb-frontend
          file: ./adhiemb-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:latest

  release-ready:
    name: Prepare Release Reference
    needs: [backend-docker, frontend-docker]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Report Release Readiness
        run: |
          echo "=================================================="
          echo "RELEASE ARTIFACTS VERIFIED AND READY FOR DEPLOYMENT"
          echo "=================================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Release Tag: ${{ steps.vars.outputs.sha_short }}"
          echo "Backend Image: ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:${{ steps.vars.outputs.sha_short }}"
          echo "Frontend Image: ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:${{ steps.vars.outputs.sha_short }}"
          echo "=================================================="

  deploy-ec2:
    name: Deploy to Production EC2 (AWS SSM + OIDC)
    needs: [backend-docker, frontend-docker]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOY == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Execute Deployment on EC2 via AWS SSM
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="${{ steps.vars.outputs.sha_short }}"
          fi

          echo "=================================================="
          echo "STARTING ADHIEMB CONTROLLED PRODUCTION DEPLOYMENT (SSM)"
          echo "Target Instance ID: ${{ vars.EC2_INSTANCE_ID }}"
          echo "Release Tag: ${RELEASE_TAG}"
          echo "=================================================="



          cat << 'EOF' > /tmp/deploy_script.sh
set -e
cd /home/ubuntu/adhiemb-ecom
git pull origin main || true
docker --version
docker compose version

if [ ! -f 'docker/docker-compose.prod.yml' ] || [ ! -f 'docker/.env.prod' ]; then
  echo 'ERROR: Required compose or environment configuration files missing!'
  exit 1
fi

PREV_BACKEND=$(docker inspect --format='{{.Config.Image}}' adhiemb-backend-prod 2>/dev/null || echo 'sathishg26/adhiemb-backend:1.0.0')
PREV_FRONTEND=$(docker inspect --format='{{.Config.Image}}' adhiemb-frontend-prod 2>/dev/null || echo 'sathishg26/adhiemb-frontend:1.0.1')
echo "Active baseline images: Backend=${PREV_BACKEND}, Frontend=${PREV_FRONTEND}"

echo "Pulling immutable release images for tag ${RELEASE_TAG}..."
docker pull sathishg26/adhiemb-backend:${RELEASE_TAG}
docker pull sathishg26/adhiemb-frontend:${RELEASE_TAG}

echo 'Validating compose file...'
BACKEND_IMAGE_TAG=${RELEASE_TAG} FRONTEND_IMAGE_TAG=${RELEASE_TAG} \
  docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml config > /dev/null

echo 'Deploying backend container...'
BACKEND_IMAGE_TAG=${RELEASE_TAG} FRONTEND_IMAGE_TAG=${RELEASE_TAG} \
  docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d backend

sleep 5
if ! docker ps | grep -q 'adhiemb-backend-prod'; then
  echo 'ERROR: Backend container failed to start!'
  docker logs --tail 50 adhiemb-backend-prod
  exit 1
fi

echo 'Performing internal backend health check...'
HEALTH_PASSED=false
for i in $(seq 1 15); do
  if docker exec adhiemb-backend-prod wget -q -O - http://localhost:8080/actuator/health 2>/dev/null | grep -q 'UP'; then
    echo 'Backend health check PASSED!'
    HEALTH_PASSED=true
    break
  fi
  sleep 5
done

if [ "$HEALTH_PASSED" = "false" ]; then
  echo 'ERROR: Backend health check failed! Aborting frontend deployment.'
  docker logs --tail 100 adhiemb-backend-prod
  echo 'Restoring baseline containers...'
  BACKEND_IMAGE_TAG=1.0.0 FRONTEND_IMAGE_TAG=1.0.1 docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d
  exit 1
fi

echo 'Deploying frontend container...'
BACKEND_IMAGE_TAG=${RELEASE_TAG} FRONTEND_IMAGE_TAG=${RELEASE_TAG} \
  docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d frontend

echo 'Verifying running containers...'
docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

echo 'Verifying container digests...'
echo "Backend Image ID: $(docker inspect --format='{{.Image}}' adhiemb-backend-prod)"
echo "Frontend Image ID: $(docker inspect --format='{{.Image}}' adhiemb-frontend-prod)"

echo 'Verifying public HTTP/HTTPS endpoints...'
curl -f -s https://adhiemb.com/api/public/products > /dev/null
curl -f -s https://adhiemb.com/actuator/health > /dev/null
echo "SUCCESS: Deployment completed cleanly for SHA ${RELEASE_TAG}"
EOF

          FULL_COMMAND="RELEASE_TAG='${RELEASE_TAG}'"$'\n'"$(cat /tmp/deploy_script.sh)"

          jq -n --arg cmd "$FULL_COMMAND" '{"commands": [$cmd]}' > /tmp/ssm_parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command Sent. Command ID: $COMMAND_ID"
          echo "Waiting for SSM execution..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "SSM Execution Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: SSM Command execution failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "SSM Command Execution Output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text