name: AdhiEMB CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: adhiemb_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: adhiemb-backend

    env:
      JWT_SECRET: "CiDummyJwtSecretKeyForTestingPurposesMustBeAtLeast256BitsLongForHS256Algorithm"
      DB_URL: "jdbc:mysql://127.0.0.1:3306/adhiemb_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: "root"
      DB_PASSWORD: "testpassword"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend (Maven)
        run: mvn clean package

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: adhiemb-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'adhiemb-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

  backend-docker:
    name: Build & Push Backend Docker Image
    needs: backend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./adhiemb-backend
          file: ./adhiemb-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:latest

  frontend-docker:
    name: Build & Push Frontend Docker Image
    needs: frontend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./adhiemb-frontend
          file: ./adhiemb-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:latest

  release-ready:
    name: Prepare Release Reference
    needs: [backend-docker, frontend-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Report Release Readiness
        run: |
          echo "=================================================="
          echo "RELEASE ARTIFACTS VERIFIED AND READY FOR DEPLOYMENT"
          echo "=================================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Release Tag: ${{ steps.vars.outputs.sha_short }}"
          echo "Backend Image: ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-backend:${{ steps.vars.outputs.sha_short }}"
          echo "Frontend Image: ${{ secrets.DOCKERHUB_USERNAME }}/adhiemb-frontend:${{ steps.vars.outputs.sha_short }}"
          echo "=================================================="

  deploy-ec2:
    name: Deploy to Production EC2
    needs: [backend-docker, frontend-docker]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOY == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script_stop: true
          script: |
            set -e
            echo "=================================================="
            echo "STARTING ADHIEMB CONTROLLED PRODUCTION DEPLOYMENT"
            echo "Release Tag: ${{ steps.vars.outputs.sha_short }}"
            echo "=================================================="

            # 1. Verify working directory and container tools
            cd /home/ubuntu/adhiemb-ecom
            docker --version
            docker compose version

            # 2. Verify Compose configuration and environment files exist
            if [ ! -f "docker/docker-compose.prod.yml" ]; then
              echo "ERROR: docker/docker-compose.prod.yml missing!"
              exit 1
            fi
            if [ ! -f "docker/.env.prod" ]; then
              echo "ERROR: docker/.env.prod missing!"
              exit 1
            fi

            # 3. Pull immutable Docker images
            echo "Pulling immutable Docker images..."
            docker pull sathishg26/adhiemb-backend:${{ steps.vars.outputs.sha_short }}
            docker pull sathishg26/adhiemb-frontend:${{ steps.vars.outputs.sha_short }}

            # 4. Verify rendered Compose configuration
            echo "Validating Compose configuration..."
            BACKEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} FRONTEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} \
              docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml config > /dev/null

            # 5. Deploy Backend First
            echo "Deploying Backend (${{ steps.vars.outputs.sha_short }})..."
            BACKEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} FRONTEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} \
              docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d backend

            # Wait for backend container startup
            sleep 5
            if ! docker ps | grep -q "adhiemb-backend-prod"; then
              echo "ERROR: Backend container failed to start!"
              docker logs --tail 50 adhiemb-backend-prod
              exit 1
            fi

            # Perform Backend Health Check
            echo "Checking backend health..."
            HEALTH_PASSED=false
            for i in $(seq 1 12); do
              if curl -s -k http://localhost:8080/api/public/products > /dev/null; then
                echo "Backend health check PASSED!"
                HEALTH_PASSED=true
                break
              fi
              echo "Waiting for backend readiness ($i/12)..."
              sleep 5
            done

            if [ "$HEALTH_PASSED" = "false" ]; then
              echo "ERROR: Backend health check failed! Aborting deployment."
              docker logs --tail 100 adhiemb-backend-prod
              exit 1
            fi

            # 6. Deploy Frontend Only After Backend Readiness
            echo "Deploying Frontend (${{ steps.vars.outputs.sha_short }})..."
            BACKEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} FRONTEND_IMAGE_TAG=${{ steps.vars.outputs.sha_short }} \
              docker compose --env-file docker/.env.prod -f docker/docker-compose.prod.yml up -d frontend

            # 7. Final Status Verification
            echo "Verifying running containers..."
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

            # HTTPS and API Verification
            echo "Verifying production HTTPS & API endpoints..."
            curl -f -s https://adhiemb.com/api/public/products > /dev/null
            echo "SUCCESS: Production deployment verified for tag ${{ steps.vars.outputs.sha_short }}"