name: OIDC Claims Diagnostic

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose-oidc:
    name: Decode OIDC Claims
    runs-on: ubuntu-latest

    steps:
      - name: Request OIDC Token & Decode Claims
        run: |
          ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | openssl base64 -d -A 2>/dev/null || echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null)
          
          echo "=================================================="
          echo "DECODED GITHUB OIDC CLAIMS"
          echo "=================================================="
          echo "iss: $(echo "$PAYLOAD" | jq -r '.iss')"
          echo "aud: $(echo "$PAYLOAD" | jq -r '.aud')"
          echo "sub: $(echo "$PAYLOAD" | jq -r '.sub')"
          echo "repository: $(echo "$PAYLOAD" | jq -r '.repository')"
          echo "repository_owner: $(echo "$PAYLOAD" | jq -r '.repository_owner')"
          echo "ref: $(echo "$PAYLOAD" | jq -r '.ref')"
          echo "ref_type: $(echo "$PAYLOAD" | jq -r '.ref_type')"
          echo "workflow: $(echo "$PAYLOAD" | jq -r '.workflow')"
          echo "job_workflow_ref: $(echo "$PAYLOAD" | jq -r '.job_workflow_ref')"
          echo "event_name: $(echo "$PAYLOAD" | jq -r '.event_name')"
          echo "=================================================="
