name: AdhiEMB SSM Connectivity Test

# ============================================================
# PURPOSE: Isolated infrastructure connectivity test.
#          Verifies GitHub Actions -> OIDC -> IAM -> SSM -> EC2
#          chain WITHOUT deploying anything to production.
#
# SAFETY:  Does NOT run docker, docker compose, or modify any
#          application files, containers, RDS, S3, or secrets.
#          Only writes a harmless file to /tmp on the EC2 host.
#
# TRIGGER: Manual only (workflow_dispatch). Never auto-runs on push.
# ============================================================

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ssm-connectivity-test:
    name: SSM Connectivity Test
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 1: Configure AWS credentials via GitHub OIDC
      # ------------------------------------------------------------
      # Tests : (A) GitHub issues OIDC token
      #         (B) IAM role AdhiEMB-GitHubActions-ProductionDeploy
      #             accepts the token via trust policy
      # Fails : If OIDC provider missing, trust policy wrong, or
      #         AWS_ROLE_ARN secret is incorrect.
      # ============================================================
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: AdhiEMB-SSM-Test

      # ============================================================
      # STEP 2: Verify AWS caller identity
      # ------------------------------------------------------------
      # Tests : Confirms the assumed role ARN matches the expected
      #         production deployment role.
      # Prints: Account (masked safe), ARN of assumed role session.
      # Does NOT print: credentials, keys, tokens.
      # ============================================================
      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "LAYER 1: AWS OIDC Authentication"
          echo "=========================================="
          IDENTITY=$(aws sts get-caller-identity --output json)
          CALLER_ARN=$(echo "$IDENTITY" | jq -r '.Arn')
          ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')
          echo "Account (partial) : ${ACCOUNT:0:4}********${ACCOUNT: -4}"
          echo "Assumed Role ARN  : $CALLER_ARN"
          if echo "$CALLER_ARN" | grep -q "AdhiEMB-GitHubActions-ProductionDeploy"; then
            echo "ROLE CHECK        : PASSED - correct production deployment role"
          else
            echo "ROLE CHECK        : WARNING - role ARN does not contain expected name"
          fi
          echo "RESULT            : OIDC to IAM role assumption SUCCEEDED"
          echo "=========================================="

      # ============================================================
      # STEP 3: Log target EC2 instance
      # ------------------------------------------------------------
      # The IAM role intentionally has NO ec2:DescribeInstances and
      # NO ssm:DescribeInstanceInformation (least-privilege).
      # Reachability is proven directly by ssm:SendCommand in Step 4.
      # ============================================================
      - name: Log Target EC2 Instance
        run: |
          echo "=========================================="
          echo "LAYER 2: Target Instance Confirmation"
          echo "=========================================="
          echo "Target Instance ID : ${{ vars.EC2_INSTANCE_ID }}"
          echo "Region             : ap-south-1"
          echo "NOTE: ec2:DescribeInstances and ssm:DescribeInstanceInformation"
          echo "      are intentionally excluded (least-privilege deployment role)."
          echo "      Connectivity is verified directly by ssm:SendCommand below."
          echo "=========================================="

      # ============================================================
      # STEP 5: Send harmless SSM RunCommand to EC2
      # ------------------------------------------------------------
      # Tests : (G) IAM role has ssm:SendCommand
      #         (H) SSM can reach and execute on the EC2 instance
      # Command: Harmless echo + write to /tmp only
      # Does NOT: touch Docker, app dirs, .env, DB, containers
      # ============================================================
      - name: Send SSM Test Command to EC2
        run: |
          echo "=========================================="
          echo "LAYER 4: SSM SendCommand"
          echo "Target: ${{ vars.EC2_INSTANCE_ID }}"
          echo "=========================================="

          python3 -c "
          import json
          script = '\n'.join([
              'set -e',
              'echo AdhiEMB_SSM_CONNECTIVITY_OK',
              'echo Target: i-09469d509a297ce2b',
              'printf \"Timestamp : %s\n\" \"\$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > /tmp/adhiemb-ssm-test.txt',
              'printf \"Hostname  : %s\n\" \"\$(hostname)\"       >> /tmp/adhiemb-ssm-test.txt',
              'printf \"Kernel    : %s\n\" \"\$(uname -r)\"       >> /tmp/adhiemb-ssm-test.txt',
              'printf \"Uptime    : %s\n\" \"\$(uptime -p)\"      >> /tmp/adhiemb-ssm-test.txt',
              'echo \"Chain     : GitHub-Actions-OIDC-IAM-SSM-EC2 : ALL-PASSED\" >> /tmp/adhiemb-ssm-test.txt',
              'echo \"--- /tmp/adhiemb-ssm-test.txt ---\"',
              'cat /tmp/adhiemb-ssm-test.txt',
              'echo \"--- end ---\"',
          ])
          payload = {'commands': [script]}
          with open('/tmp/ssm-conn-test-params.json', 'w') as f:
              json.dump(payload, f)
          print('SSM parameters written: /tmp/ssm-conn-test-params.json')
          "

          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-conn-test-params.json \
            --comment "AdhiEMB SSM Connectivity Test - harmless echo only" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "FAIL: SSM send-command returned empty/None CommandId"
            echo "DIAGNOSIS [G]: Verify ssm:SendCommand is in the IAM role policy."
            echo "DIAGNOSIS [G]: Verify instance state is 'running' and SSM agent is Online."
            exit 1
          fi

          echo "SSM Command ID : $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "=========================================="

      # ============================================================
      # STEP 6: Wait for SSM command to complete
      # ============================================================
      - name: Wait for SSM Command Completion
        run: |
          echo "=========================================="
          echo "LAYER 5: Waiting for SSM Command Completion"
          echo "Command ID : $COMMAND_ID"
          echo "=========================================="
          aws ssm wait command-executed \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          echo "Wait complete."
          echo "=========================================="

      # ============================================================
      # STEP 7: Retrieve and evaluate SSM command result
      # ------------------------------------------------------------
      # Prints : Status, safe stdout, safe stderr
      # Does NOT print: DB_PASSWORD, JWT_SECRET, .env.prod, credentials
      # Fails  : If Status != Success
      # ============================================================
      - name: Verify SSM Command Result
        run: |
          echo "=========================================="
          echo "LAYER 6: SSM Command Result"
          echo "Command ID : $COMMAND_ID"
          echo "Target     : ${{ vars.EC2_INSTANCE_ID }}"
          echo "=========================================="

          INVOCATION=$(aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --output json)

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          STDOUT=$(echo "$INVOCATION" | jq -r '.StandardOutputContent')
          STDERR=$(echo "$INVOCATION" | jq -r '.StandardErrorContent')

          echo "SSM Status : $STATUS"
          echo ""
          echo "--- Standard Output ---"
          echo "$STDOUT"

          if [ -n "$STDERR" ] && [ "$STDERR" != "null" ] && [ "$STDERR" != "" ]; then
            echo ""
            echo "--- Standard Error ---"
            echo "$STDERR"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo ""
            echo "FAIL: SSM command status: $STATUS"
            echo "DIAGNOSIS [H]: Command reached EC2 but failed during execution."
            echo "               Review Standard Error above for the root cause."
            exit 1
          fi

          if ! echo "$STDOUT" | grep -q "AdhiEMB_SSM_CONNECTIVITY_OK"; then
            echo ""
            echo "FAIL: stdout does not contain 'AdhiEMB_SSM_CONNECTIVITY_OK'"
            echo "DIAGNOSIS: SSM executed but the expected output was not found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "AdhiEMB_SSM_CONNECTIVITY_OK"
          echo "=========================================="
          echo "CHAIN VERIFIED:"
          echo "  GitHub Actions -> OIDC Token Issue    : PASSED"
          echo "  OIDC           -> IAM Role Assumption : PASSED"
          echo "  IAM Role       -> SSM SendCommand     : PASSED"
          echo "  SSM            -> EC2 Execution       : PASSED"
          echo "  EC2            -> Command Success     : PASSED"
          echo "  stdout contains AdhiEMB_SSM_CONNECTIVITY_OK : PASSED"
          echo "=========================================="
          echo "Target Instance : ${{ vars.EC2_INSTANCE_ID }}"
          echo "Command ID      : $COMMAND_ID"
          echo "Status          : $STATUS"
          echo "=========================================="
