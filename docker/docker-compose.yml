version: '3.8'

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: adhiemb_db
      MYSQL_USER: adhiemb_user
      MYSQL_PASSWORD: adhiemb_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adhiemb-network

  backend:
    build:
      context: ../adhiemb-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/adhiemb_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=adhiemb_user
      - SPRING_DATASOURCE_PASSWORD=adhiemb_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - adhiemb-network

  frontend:
    build:
      context: ../adhiemb-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - adhiemb-network

networks:
  adhiemb-network:
    driver: bridge

volumes:
  mysql-data:
