services:
  backend:
    build:
      context: ../adhiemb-backend
      dockerfile: Dockerfile
    container_name: adhiemb-backend-prod
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-adhiemb-ecom-fstore}
    networks:
      - adhiemb-prod-network
    expose:
      - "8080"

  frontend:
    build:
      context: ../adhiemb-frontend
      dockerfile: Dockerfile
    container_name: adhiemb-frontend-prod
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - adhiemb-prod-network

networks:
  adhiemb-prod-network:
    name: adhiemb-prod-network
    driver: bridge
