services:
  mysql:
    image: mysql:8.0
    container_name: adhiemb-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-adhiemb_db}
      MYSQL_USER: ${DB_USERNAME:-adhiemb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - adhiemb-prod-network

  backend:
    build:
      context: ../adhiemb-backend
      dockerfile: Dockerfile
    container_name: adhiemb-backend-prod
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://mysql:3306/${DB_NAME:-adhiemb_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=${DB_USERNAME:-adhiemb_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/var/app/fstore-prod
      - FSTORE_PATH=/var/app/fstore-prod
    volumes:
      - fstore-prod-data:/var/app/fstore-prod
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - adhiemb-prod-network
    expose:
      - "8080"

  frontend:
    build:
      context: ../adhiemb-frontend
      dockerfile: Dockerfile
    container_name: adhiemb-frontend-prod
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - adhiemb-prod-network

networks:
  adhiemb-prod-network:
    name: adhiemb-prod-network
    driver: bridge

volumes:
  mysql-prod-data:
    name: adhiemb-mysql-prod-data
  fstore-prod-data:
    name: adhiemb-fstore-prod-data
